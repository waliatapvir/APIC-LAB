---
- name: Create Cisco ACI Tenant
  hosts: localhost
  gather_facts: false
  collections:
    - cisco.aci

  tasks:
    - name: Ensure the Tenant exists on Cisco APIC LAB
      cisco.aci.aci_tenant:
        host: "{{ inventory_hostname }}"
        username: "{{ ansible_user }}"
        password: "{{ ansible_password }}"
        validate_certs: false
        tenant: "AWX_Inventory_Tenant"
        state: present
        output_level: info
      register: tenant_result
