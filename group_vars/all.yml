---
# ACI connection defaults — non-secret values only
# Secrets (ansible_user, ansible_password) are injected by Ansible Tower
# via a "Machine" or custom "Network" credential — do NOT define them here

aci_validate_certs: false
aci_output_level: info

# Tenant defaults
tenant_name: AWX_Inventory_Tenant
tenant_state: present

# VRF
vrf_name: vrf_name
vrf_state: present

# Bridge Domain
bd_name: bd_name
bd_state: present

# Subnet
subnet_gateway: subnet_gateway    # e.g. 192.168.1.1/24
subnet_scope: private                
subnet_state: present

# Application Profile
ap_name: test_ap
ap_state: present

# Endpoint Group
epg_name: test_epg
epg_state: present
